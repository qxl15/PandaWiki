services:
  panda-wiki-postgres:
    image: postgres:16-alpine
    container_name: panda-wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: panda-wiki
      POSTGRES_USER: panda-wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panda-wiki -d panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 10

  panda-wiki-redis:
    image: redis:7-alpine
    container_name: panda-wiki-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data

  panda-wiki-nats:
    image: nats:2.10-alpine
    container_name: panda-wiki-nats
    restart: unless-stopped
    command: ["--user", "panda-wiki", "--pass", "${NATS_PASSWORD}"]
    networks:
      panda-wiki-net:
        ipv4_address: 169.254.15.13

  panda-wiki-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: panda-wiki-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: s3panda-wiki
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      panda-wiki-net:
        ipv4_address: 169.254.15.12

  panda-wiki-caddy:
    image: caddy:2.10.2
    container_name: panda-wiki-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-run:/run
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      panda-wiki-net:
        ipv4_address: 169.254.15.3

  panda-wiki-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile.api
    image: panda-wiki-api:custom
    container_name: panda-wiki-api
    restart: unless-stopped
    depends_on:
      panda-wiki-postgres:
        condition: service_healthy
      panda-wiki-redis:
        condition: service_started
      panda-wiki-nats:
        condition: service_started
      panda-wiki-minio:
        condition: service_started
      panda-wiki-caddy:
        condition: service_started
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PG_DSN: host=panda-wiki-postgres user=panda-wiki password=${POSTGRES_PASSWORD} dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai
      REDIS_ADDR: panda-wiki-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MQ_NATS_SERVER: nats://169.254.15.13:4222
      NATS_PASSWORD: ${NATS_PASSWORD}
      S3_ENDPOINT: panda-wiki-minio:9000
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      RAG_CT_RAG_BASE_URL: ${RAG_CT_RAG_BASE_URL}
      RAG_CT_RAG_API_KEY: ${RAG_CT_RAG_API_KEY}
      SUBNET_PREFIX: 169.254.15
      CADDY_API: /run/caddy-admin.sock
      SENTRY_ENABLED: "false"
    volumes:
      - caddy-run:/run
    ports:
      - "8000:8000"
    networks:
      panda-wiki-net:
        ipv4_address: 169.254.15.2

  panda-wiki-consumer:
    build:
      context: ../../backend
      dockerfile: Dockerfile.consumer
    image: panda-wiki-consumer:custom
    container_name: panda-wiki-consumer
    restart: unless-stopped
    depends_on:
      panda-wiki-api:
        condition: service_started
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PG_DSN: host=panda-wiki-postgres user=panda-wiki password=${POSTGRES_PASSWORD} dbname=panda-wiki port=5432 sslmode=disable TimeZone=Asia/Shanghai
      REDIS_ADDR: panda-wiki-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MQ_NATS_SERVER: nats://169.254.15.13:4222
      NATS_PASSWORD: ${NATS_PASSWORD}
      S3_ENDPOINT: panda-wiki-minio:9000
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      RAG_CT_RAG_BASE_URL: ${RAG_CT_RAG_BASE_URL}
      RAG_CT_RAG_API_KEY: ${RAG_CT_RAG_API_KEY}
      SUBNET_PREFIX: 169.254.15
      CADDY_API: /run/caddy-admin.sock
      SENTRY_ENABLED: "false"
    volumes:
      - caddy-run:/run
    networks:
      panda-wiki-net:
        ipv4_address: 169.254.15.4

  panda-wiki-app:
    build:
      context: ../..
      dockerfile: deploy/custom/Dockerfile.app
    image: panda-wiki-app:custom
    container_name: panda-wiki-app
    restart: unless-stopped
    depends_on:
      panda-wiki-api:
        condition: service_started
    environment:
      TARGET: http://169.254.15.2:8000
      DEV_KB_ID: ${DEV_KB_ID}
      NODE_ENV: production
    ports:
      - "3010:3010"
    networks:
      panda-wiki-net:
        ipv4_address: 169.254.15.112

networks:
  panda-wiki-net:
    name: panda-wiki-net
    driver: bridge
    ipam:
      config:
        - subnet: 169.254.15.0/24

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-run:
  caddy-data:
  caddy-config:
